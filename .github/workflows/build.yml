name: Build typed-voice-server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: typed-voice-server-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Initialize typed-voice submodule only
        run: git submodule update --init --recursive --depth 1 typed-voice
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test Node server core
        run: node --test test/*.test.mjs
      - name: Test remote browser client core
        run: node --test typed-voice/test/remote-client-identity.test.js typed-voice/test/remote-wss-transport.test.js typed-voice/test/remote-voice-runtime.test.js
      - name: Check remote worker entrypoints
        run: node --check worker/remote-http-worker.mjs && node --check worker/trusted-worker-http-worker.mjs && node --check typed-voice/src/worker.js
      - name: Normalize Server.cmd to Windows CRLF
        run: |
          sed -i 's/\r$//' Server.cmd
          sed -i 's/$/\r/' Server.cmd
      - name: Assemble local release artifact
        run: |
          mkdir -p dist/typed-voice-server
          cp server-main.mjs docker.mjs Server.cmd package.json README.md INSTALL.md SPECIFICATION.md LICENSE dist/typed-voice-server/
          cp -R server admin worker web docs data dist/typed-voice-server/
          cp typed-voice/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          cat > dist/RELEASE_NOTES.md <<'EOF'
          CI-built typed-voice-server runtime.

          Browser worker assets are served by the typed-voice GitHub Pages deployment and are not bundled into this archive. Double-click Server.cmd on Windows to verify runtime requirements and start the server.
          Trusted browser workers authenticate through the local Worker login URL, then run the GitHub Pages worker.html against the server's public WSS endpoint.
          Node.js 22.13 through 24.x, Codex CLI with the Windows sandbox setup, and cloudflared are runtime requirements for the default Windows launch path.
          EOF
          cd dist
          zip -r typed-voice-server.zip typed-voice-server
      - uses: actions/upload-artifact@v7
        with:
          name: typed-voice-server-local
          path: |
            dist/typed-voice-server.zip
            dist/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
      - name: Update latest runtime release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: ${{ github.workspace }}/dist/typed-voice-server.zip,${{ github.workspace }}/dist/THIRD_PARTY_NOTICES.md
          artifactErrorsFailBuild: true
          bodyFile: ${{ github.workspace }}/dist/RELEASE_NOTES.md
          makeLatest: true
          name: typed-voice-server - Latest (Build ${{ github.run_number }})
          tag: typed-voice-server-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: false
